<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Relasi audit laptop</title>
  <desc id="desc">laptop_logs menyimpan foreign key nullable ke users dan laptops. Penghapusan parent mengosongkan foreign key tetapi mempertahankan snapshot log. SQLx ledger tidak berelasi ke tabel bisnis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#b45309" />
    </marker>
  </defs>
  <rect width="960" height="390" rx="24" fill="#f8fafc" />
  <text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#b45309">POSTGRESQL · AUDIT</text>
  <text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Riwayat tetap ada setelah laptop dihapus</text>
  <g font-family="system-ui,sans-serif">
    <rect x="42" y="128" width="240" height="164" rx="16" fill="#ede9fe" />
    <text x="66" y="163" font-size="18" font-weight="750" fill="#5b21b6">users</text>
    <text x="66" y="195" font-size="13" fill="#1e293b">id · username</text>
    <text x="66" y="219" font-size="13" fill="#1e293b">role</text>
    <text x="66" y="269" font-size="12" fill="#475569">akun dan role</text>

    <rect x="360" y="128" width="240" height="164" rx="16" fill="#fef3c7" />
    <text x="384" y="163" font-size="18" font-weight="750" fill="#92400e">laptop_logs</text>
    <text x="384" y="195" font-size="13" fill="#1e293b">user_id? · laptop_id?</text>
    <text x="384" y="219" font-size="13" fill="#1e293b">operation · changed_at</text>
    <text x="384" y="243" font-size="13" fill="#1e293b">old_data · new_data</text>
    <text x="384" y="269" font-size="12" fill="#475569">snapshot audit JSONB</text>

    <rect x="678" y="128" width="240" height="164" rx="16" fill="#dbeafe" />
    <text x="702" y="163" font-size="18" font-weight="750" fill="#1e3a8a">laptops</text>
    <text x="702" y="195" font-size="13" fill="#1e293b">id · nama · merek</text>
    <text x="702" y="219" font-size="13" fill="#1e293b">harga · stok</text>
    <text x="702" y="269" font-size="12" fill="#475569">inventaris saat ini</text>

    <rect x="360" y="320" width="240" height="44" rx="12" fill="#e2e8f0" />
    <text x="480" y="348" text-anchor="middle" font-size="12" font-weight="650" fill="#334155">_sqlx_migrations · ledger internal · tanpa FK bisnis</text>
  </g>
  <path d="M360 207h-66" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M600 207h66" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />
  <text x="326" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">SET NULL</text>
  <text x="634" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">SET NULL</text>
  <text x="480" y="304" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">FK nullable: satu user/laptop memiliki 0..N log; tiap log memiliki 0..1 referensi</text>
</svg>
