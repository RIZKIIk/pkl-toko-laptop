<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Alur startup aplikasi Toko Laptop</title>
  <desc id="desc">Diagram delapan tahap main.rs dari memuat environment hingga server Axum menerima request. Setiap tahap dapat gagal dan menghentikan startup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#182b3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#f8fafc}
      .subtitle{font:400 16px system-ui,sans-serif;fill:#b8c7d9}
      .step{font:700 17px system-ui,sans-serif;fill:#f8fafc}
      .detail{font:400 13px system-ui,sans-serif;fill:#cbd5e1}
      .number{font:700 14px system-ui,sans-serif;fill:#082f49}
      .small{font:600 13px system-ui,sans-serif;fill:#bae6fd}
      .warning{font:600 14px system-ui,sans-serif;fill:#fecaca}
      .footer{font:400 13px system-ui,sans-serif;fill:#94a3b8}
    </style>
  </defs>

  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#0ea5e9" opacity=".07"/>
  <circle cx="70" cy="690" r="180" fill="#34d399" opacity=".05"/>

  <text x="64" y="68" class="title">Bagaimana aplikasi mulai berjalan?</text>
  <text x="64" y="98" class="subtitle">Alur kerja src/main.rs · dari konfigurasi sampai server siap menerima request</text>
  <rect x="64" y="119" width="1072" height="3" rx="2" fill="url(#accent)"/>

  <!-- Main flow row 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="160" width="320" height="112" rx="16" fill="#203449" stroke="#38bdf8" stroke-opacity=".65"/>
    <rect x="416" y="160" width="320" height="112" rx="16" fill="#203449" stroke="#38bdf8" stroke-opacity=".65"/>
    <rect x="768" y="160" width="368" height="112" rx="16" fill="#203449" stroke="#38bdf8" stroke-opacity=".65"/>
  </g>
  <circle cx="91" cy="187" r="15" fill="#7dd3fc"/><text x="91" y="192" text-anchor="middle" class="number">1</text>
  <text x="118" y="193" class="step">Memuat environment</text>
  <text x="88" y="225" class="detail">Membaca nilai dari file .env</text>
  <text x="88" y="246" class="detail">jika file tersedia.</text>

  <circle cx="443" cy="187" r="15" fill="#7dd3fc"/><text x="443" y="192" text-anchor="middle" class="number">2</text>
  <text x="470" y="193" class="step">Membaca konfigurasi</text>
  <text x="440" y="225" class="detail">AppConfig memeriksa host, port,</text>
  <text x="440" y="246" class="detail">database, admin, dan JWT.</text>

  <circle cx="795" cy="187" r="15" fill="#7dd3fc"/><text x="795" y="192" text-anchor="middle" class="number">3</text>
  <text x="822" y="193" class="step">Menghubungkan PostgreSQL</text>
  <text x="792" y="225" class="detail">Membuat PgPool untuk dipakai</text>
  <text x="792" y="246" class="detail">oleh bagian aplikasi.</text>

  <path d="M384 216 H408" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M736 216 H760" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- turn down and row 2 right-to-left -->
  <path d="M952 272 V310" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="768" y="326" width="368" height="112" rx="16" fill="#26364a" stroke="#34d399" stroke-opacity=".75"/>
    <rect x="416" y="326" width="320" height="112" rx="16" fill="#26364a" stroke="#34d399" stroke-opacity=".75"/>
    <rect x="64" y="326" width="320" height="112" rx="16" fill="#26364a" stroke="#34d399" stroke-opacity=".75"/>
  </g>
  <circle cx="795" cy="353" r="15" fill="#6ee7b7"/><text x="795" y="358" text-anchor="middle" class="number">4</text>
  <text x="822" y="359" class="step">Menjalankan migration</text>
  <text x="792" y="391" class="detail">Menerapkan perubahan struktur</text>
  <text x="792" y="412" class="detail">database yang belum dijalankan.</text>

  <circle cx="443" cy="353" r="15" fill="#6ee7b7"/><text x="443" y="358" text-anchor="middle" class="number">5</text>
  <text x="470" y="359" class="step">Menyiapkan akun admin</text>
  <text x="440" y="391" class="detail">Memproses password lama dan</text>
  <text x="440" y="412" class="detail">menyinkronkan akun admin.</text>

  <circle cx="91" cy="353" r="15" fill="#6ee7b7"/><text x="91" y="358" text-anchor="middle" class="number">6</text>
  <text x="118" y="359" class="step">Membuat router API</text>
  <text x="88" y="391" class="detail">Menyiapkan route dan kebutuhan</text>
  <text x="88" y="412" class="detail">aplikasi untuk menangani request.</text>

  <path d="M768 382 H744" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M416 382 H392" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- row 3 -->
  <path d="M224 438 V478" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="224" y="494" width="320" height="112" rx="16" fill="#203449" stroke="#38bdf8" stroke-opacity=".65"/>
    <rect x="656" y="494" width="320" height="112" rx="16" fill="#123d3a" stroke="#34d399" stroke-width="1.6"/>
  </g>
  <circle cx="251" cy="521" r="15" fill="#7dd3fc"/><text x="251" y="526" text-anchor="middle" class="number">7</text>
  <text x="278" y="527" class="step">Membuka listener TCP</text>
  <text x="248" y="559" class="detail">Mengikat server ke APP_HOST</text>
  <text x="248" y="580" class="detail">dan APP_PORT.</text>

  <path d="M544 550 H648" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="683" cy="521" r="15" fill="#6ee7b7"/><text x="683" y="526" text-anchor="middle" class="number">8</text>
  <text x="710" y="527" class="step">Menjalankan Axum</text>
  <text x="680" y="559" class="detail">Server mulai menerima koneksi</text>
  <text x="680" y="580" class="detail">dan request dari pengguna.</text>

  <rect x="64" y="638" width="1072" height="66" rx="14" fill="#3b2530" stroke="#fb7185" stroke-opacity=".65"/>
  <text x="88" y="665" class="warning">Jika langkah penting gagal:</text>
  <text x="88" y="687" class="detail">operator ? meneruskan error, lalu startup berhenti. Server tidak lanjut ke tahap berikutnya.</text>
  <text x="64" y="735" class="footer">Catatan: .await menunggu operasi asynchronous; ? meneruskan error dari hasil operasi tersebut.</text>
</svg>
