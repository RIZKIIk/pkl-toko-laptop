<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Siklus session login</title><desc id="desc">Setelah login server mengganti ID dan menyimpan username, client menerima cookie penunjuk session yang disimpan sementara di memory store.</desc><rect width="960" height="300" rx="24" fill="#f8fafc"/><text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#0891b2">SESSION COOKIE</text><text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Cookie menunjuk ke session server</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="70" y="132" width="190" height="88" rx="16" fill="#dbeafe"/><text x="165" y="169" font-size="15" font-weight="700" fill="#1e3a8a">Client login</text><text x="165" y="194" font-size="12" fill="#334155">username + password</text><rect x="385" y="132" width="190" height="88" rx="16" fill="#ede9fe"/><text x="480" y="169" font-size="15" font-weight="700" fill="#5b21b6">Server</text><text x="480" y="194" font-size="12" fill="#334155">cycle ID + simpan user</text><rect x="700" y="132" width="190" height="88" rx="16" fill="#dcfce7"/><text x="795" y="169" font-size="15" font-weight="700" fill="#166534">MemoryStore</text><text x="795" y="194" font-size="12" fill="#334155">session sementara</text></g><path d="M260 158h115m200 0h115" stroke="#64748b" stroke-width="2.5"/><path d="m375 152 12 6-12 6m303-12 12 6-12 6" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="M480 225v35H165v-35" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="480" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Cookie dibawa client; session hilang saat server restart, logout menghapus session aktif</text></svg>
