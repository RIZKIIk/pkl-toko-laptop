<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Ringkasan lapisan aplikasi</title><desc id="desc">Urutan client, routes, handler, validation, repository, database, presenter, dan response.</desc><rect width="1000" height="300" rx="24" fill="#f8fafc"/><text x="38" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#7c3aed">RANGKUMAN</text><text x="38" y="82" font-family="system-ui,sans-serif" font-size="26" font-weight="750" fill="#0f172a">Satu alur, beberapa tanggung jawab</text><g font-family="system-ui,sans-serif" text-anchor="middle" font-size="14" font-weight="700"><rect x="38" y="133" width="130" height="68" rx="14" fill="#dbeafe"/><text x="103" y="173" fill="#1e3a8a">Client</text><rect x="202" y="133" width="130" height="68" rx="14" fill="#ede9fe"/><text x="267" y="173" fill="#5b21b6">Routes + auth</text><rect x="366" y="133" width="130" height="68" rx="14" fill="#dcfce7"/><text x="431" y="173" fill="#166534">Handler</text><rect x="530" y="133" width="130" height="68" rx="14" fill="#fef3c7"/><text x="595" y="173" fill="#92400e">Validation</text><rect x="694" y="133" width="130" height="68" rx="14" fill="#ffedd5"/><text x="759" y="173" fill="#9a3412">Repository</text><rect x="858" y="133" width="104" height="68" rx="14" fill="#fee2e2"/><text x="910" y="173" fill="#991b1b" font-size="12">PostgreSQL</text></g><g stroke="#64748b" stroke-width="2.5"><path d="M168 167h30m134 0h30m134 0h30m134 0h30m134 0h30"/></g><text x="500" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#475569">Presenter membentuk hasil query menjadi JSON; ApiError menangani jalur gagal</text></svg>
