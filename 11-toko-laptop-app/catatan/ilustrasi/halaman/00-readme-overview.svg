<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Peta Toko Laptop App</title><desc id="desc">Client mengirim request melalui autentikasi dan lapisan aplikasi ke PostgreSQL, lalu menerima response JSON.</desc>
<rect width="1000" height="320" rx="24" fill="#f8fafc"/><text x="40" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#2563eb">TOKO LAPTOP APP</text><text x="40" y="82" font-family="system-ui,sans-serif" font-size="26" font-weight="750" fill="#0f172a">Peta request dan response</text>
<g font-family="system-ui,sans-serif" text-anchor="middle"><g><rect x="38" y="132" width="142" height="94" rx="16" fill="#dbeafe"/><text x="109" y="170" font-size="16" font-weight="700" fill="#1e3a8a">Client</text><text x="109" y="196" font-size="12" fill="#334155">curl / Postman</text></g>
<g><rect x="224" y="132" width="142" height="94" rx="16" fill="#ede9fe"/><text x="295" y="170" font-size="16" font-weight="700" fill="#5b21b6">Routes + auth</text><text x="295" y="196" font-size="12" fill="#334155">akses dan role</text></g>
<g><rect x="410" y="132" width="142" height="94" rx="16" fill="#dcfce7"/><text x="481" y="170" font-size="16" font-weight="700" fill="#166534">Handler</text><text x="481" y="196" font-size="12" fill="#334155">validasi input</text></g>
<g><rect x="596" y="132" width="142" height="94" rx="16" fill="#fef3c7"/><text x="667" y="170" font-size="16" font-weight="700" fill="#92400e">Repository</text><text x="667" y="196" font-size="12" fill="#334155">query SQLx</text></g>
<g><rect x="782" y="132" width="180" height="94" rx="16" fill="#fee2e2"/><text x="872" y="170" font-size="16" font-weight="700" fill="#991b1b">PostgreSQL</text><text x="872" y="196" font-size="12" fill="#334155">laptops + users</text></g></g>
