<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Response autentikasi</title><desc id="desc">Hasil proses auth dibentuk menjadi JSON sukses 200 atau JSON error dengan status HTTP yang diberikan pemanggil.</desc><rect width="960" height="300" rx="24" fill="#f8fafc"/><text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#2563eb">AUTH RESPONSE</text><text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Helper menyatukan bentuk JSON</text><rect x="360" y="120" width="240" height="64" rx="16" fill="#e0e7ff"/><text x="480" y="159" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#3730a3">Hasil handler / middleware</text><path d="M480 184v28M480 212H240v20M480 212h240v20" stroke="#64748b" stroke-width="2.5" fill="none"/><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="100" y="232" width="280" height="48" rx="14" fill="#dcfce7"/><text x="240" y="262" font-size="14" font-weight="700" fill="#166534">success_response → 200 + JSON</text><rect x="580" y="232" width="280" height="48" rx="14" fill="#fee2e2"/><text x="720" y="262" font-size="14" font-weight="700" fill="#991b1b">error_response → status + JSON</text></g><text x="480" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">status ditentukan pemanggil</text></svg>
