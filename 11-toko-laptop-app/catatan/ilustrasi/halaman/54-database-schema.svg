<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Skema database toko laptop</title><desc id="desc">Baseline SQLx menyiapkan tabel laptops untuk inventaris dan users untuk akun, role, hash password, serta versi JWT.</desc><rect width="960" height="300" rx="24" fill="#f8fafc"/><text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#b45309">POSTGRESQL</text><text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Dua tabel inti, satu baseline final</text><g font-family="system-ui,sans-serif"><rect x="120" y="117" width="300" height="142" rx="16" fill="#dbeafe"/><text x="148" y="151" font-size="17" font-weight="750" fill="#1e3a8a">laptops</text><text x="148" y="180" font-size="13" fill="#1e293b">id · nama · merek</text><text x="148" y="205" font-size="13" fill="#1e293b">harga · stok · timestamps</text><text x="148" y="236" font-size="12" fill="#475569">data inventaris</text><rect x="540" y="117" width="300" height="142" rx="16" fill="#ede9fe"/><text x="568" y="151" font-size="17" font-weight="750" fill="#5b21b6">users</text><text x="568" y="180" font-size="13" fill="#1e293b">id · username · password_hash</text><text x="568" y="205" font-size="13" fill="#1e293b">role · token_version</text><text x="568" y="236" font-size="12" fill="#475569">akun dan akses</text></g><path d="M420 188h112" stroke="#b45309" stroke-width="3"/><path d="m532 181 14 7-14 7" fill="none" stroke="#b45309" stroke-width="3"/><text x="480" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Startup SQLx menerapkan skema pada database baru maupun upgrade data lama</text></svg>
