<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Pencabutan JWT dengan token version</title><desc id="desc">JWT lama memuat versi nol. Logout menaikkan versi di database ke satu sehingga JWT lama ditolak dan token hasil login baru diterima.</desc><rect width="960" height="300" rx="24" fill="#f8fafc"/><text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#be123c">TOKEN VERSION</text><text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Logout membuat versi JWT lama tidak cocok</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="62" y="127" width="220" height="65" rx="15" fill="#dbeafe"/><text x="172" y="155" font-size="14" font-weight="700" fill="#1e3a8a">JWT lama</text><text x="172" y="177" font-size="12" fill="#334155">token_version = 0</text><rect x="370" y="127" width="220" height="65" rx="15" fill="#fee2e2"/><text x="480" y="155" font-size="14" font-weight="700" fill="#991b1b">Logout</text><text x="480" y="177" font-size="12" fill="#334155">database: 0 → 1</text><rect x="678" y="127" width="220" height="65" rx="15" fill="#fef3c7"/><text x="788" y="155" font-size="14" font-weight="700" fill="#92400e">Pemeriksaan versi</text><text x="788" y="177" font-size="12" fill="#334155">0 ≠ 1 → tolak</text></g><path d="M282 159h80m228 0h80" stroke="#64748b" stroke-width="2.5"/><path d="m362 153 12 6-12 6m308-12 12 6-12 6" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="480" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Login berikutnya menerbitkan JWT baru dengan token_version = 1</text><rect x="352" y="255" width="256" height="32" rx="12" fill="#dcfce7"/><text x="480" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">JWT baru diterima</text></svg>
