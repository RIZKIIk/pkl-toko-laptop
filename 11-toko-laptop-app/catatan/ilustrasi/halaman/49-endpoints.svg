<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Peta endpoint API</title><desc id="desc">Endpoint publik untuk health dan auth, endpoint admin untuk pengelolaan akun, serta endpoint laptop dengan izin berdasarkan role.</desc>
<rect width="1000" height="320" rx="24" fill="#f8fafc"/><text x="40" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#0891b2">API ROUTES</text><text x="40" y="82" font-family="system-ui,sans-serif" font-size="26" font-weight="750" fill="#0f172a">Pilih endpoint sesuai akses</text>
<g font-family="system-ui,sans-serif"><rect x="42" y="118" width="270" height="154" rx="18" fill="#dbeafe"/><text x="66" y="151" font-size="17" font-weight="750" fill="#1e3a8a">Publik</text><text x="66" y="184" font-size="13" fill="#1e293b">GET /health</text><text x="66" y="210" font-size="13" fill="#1e293b">POST /api/auth/register</text><text x="66" y="236" font-size="13" fill="#1e293b">POST /api/auth/login</text>
<rect x="365" y="118" width="270" height="154" rx="18" fill="#ede9fe"/><text x="389" y="151" font-size="17" font-weight="750" fill="#5b21b6">Admin</text><text x="389" y="184" font-size="13" fill="#1e293b">POST /api/admin/users</text><text x="389" y="210" font-size="13" fill="#1e293b">PATCH .../{username}/role</text><text x="389" y="244" font-size="12" fill="#475569">Akun dan pengaturan role</text>
<rect x="688" y="118" width="270" height="154" rx="18" fill="#dcfce7"/><text x="712" y="151" font-size="17" font-weight="750" fill="#166534">Laptop · perlu login</text><text x="712" y="184" font-size="13" fill="#1e293b">GET: admin, buyer, restocker</text><text x="712" y="210" font-size="13" fill="#1e293b">POST / DELETE: admin</text><text x="712" y="236" font-size="13" fill="#1e293b">PATCH: admin, restocker</text></g>
<path d="M312 195h43M635 195h43" stroke="#64748b" stroke-width="3"/><path d="m355 189 12 6-12 6m311-12 12 6-12 6" fill="none" stroke="#64748b" stroke-width="3"/><text x="500" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">Login memberi session cookie dan JWT bearer untuk route terlindungi</text></svg>
