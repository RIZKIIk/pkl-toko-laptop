<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Pemeriksaan middleware autentikasi</title><desc id="desc">Middleware memeriksa JWT atau session, memvalidasi identitas dan role, lalu meneruskan atau menolak request.</desc><rect width="960" height="300" rx="24" fill="#f8fafc"/><text x="36" y="48" font-family="system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#7c3aed">AUTH MIDDLEWARE</text><text x="36" y="82" font-family="system-ui,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Kenali identitas, periksa izin</text><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="44" y="131" width="170" height="84" rx="16" fill="#dbeafe"/><text x="129" y="166" font-size="15" font-weight="700" fill="#1e3a8a">Request</text><text x="129" y="190" font-size="12" fill="#334155">JWT / cookie</text><rect x="276" y="131" width="190" height="84" rx="16" fill="#ede9fe"/><text x="371" y="166" font-size="15" font-weight="700" fill="#5b21b6">Autentikasi</text><text x="371" y="190" font-size="12" fill="#334155">cek token / session</text><rect x="528" y="131" width="180" height="84" rx="16" fill="#fef3c7"/><text x="618" y="166" font-size="15" font-weight="700" fill="#92400e">Database + role</text><text x="618" y="190" font-size="12" fill="#334155">identitas dan izin</text><rect x="770" y="112" width="150" height="55" rx="14" fill="#dcfce7"/><text x="845" y="146" font-size="14" font-weight="700" fill="#166534">Lanjut → handler</text><rect x="770" y="188" width="150" height="48" rx="14" fill="#fee2e2"/><text x="845" y="218" font-size="14" font-weight="700" fill="#991b1b">401 / 403 / 500</text></g><path d="M214 173h56m196 0h56m180 0h56m-140 0h116v-34m-116 34h116v39" fill="none" stroke="#64748b" stroke-width="2.5"/><text x="480" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">JWT dicoba lebih dahulu; session menjadi jalur autentikasi berikutnya</text></svg>
