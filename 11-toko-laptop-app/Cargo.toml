[package]
# Metadata yang dipakai Cargo untuk membangun binary aplikasi.
default-run = "toko_laptop_app"
name = "toko_laptop_app"
version = "0.1.0"
edition = "2024"

[dependencies]
# Framework HTTP untuk router, handler, extractor, dan response.
axum = "0.8.9"
# Runtime async; fitur dipilih untuk macro, multi-thread, dan listener TCP.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# PostgreSQL pool, runtime Tokio, migration, macro query, dan TLS Rustls.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
# Memuat konfigurasi lokal dari file `.env` ketika file tersedia.
dotenvy = "0.15"
# Membaca payload JSON menjadi tipe Rust dan menyiapkan serialisasi.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session cookie serta penandatanganan dan verifikasi access token JWT.
tower-sessions = "0.15.0"
jsonwebtoken = "9.3.1"
# Hash password menggunakan Argon2id dan salt acak per password.
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
# Utilitas request in-process yang dipakai test router.
tower = { version = "0.5", features = ["util"] }
